<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aegos Intel — Company Intelligence Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  overflow: hidden;
  background: #05090F;
  color: #E8ECF5;
  font-family: 'Plus Jakarta Sans', sans-serif;
}

body {
  display: flex;
  flex-direction: column;
  height: 100vh;
}

.bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  background:
    radial-gradient(ellipse 80% 60% at 72% 18%, rgba(40,80,180,0.28) 0%, transparent 65%),
    radial-gradient(ellipse 50% 70% at 85% 50%, rgba(20,50,140,0.18) 0%, transparent 60%),
    radial-gradient(ellipse 60% 50% at 20% 80%, rgba(10,30,90,0.22) 0%, transparent 55%),
    #05090F;
}
.bg::after {
  content: '';
  position: absolute;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.06'/%3E%3C/svg%3E");
  opacity: 0.5;
  pointer-events: none;
}

/* NAV */
nav {
  position: relative;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 56px;
  height: 64px;
}

.logo {
  display: flex;
  align-items: baseline;
  text-decoration: none;
}
.logo-a {
  font-size: 15px;
  font-weight: 300;
  color: rgba(232,236,245,0.85);
  letter-spacing: 0.14em;
  text-transform: uppercase;
}
.logo-b {
  font-size: 15px;
  font-weight: 600;
  color: #ffffff;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 40px;
  list-style: none;
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
}
.nav-links a {
  text-decoration: none;
  font-size: 12.5px;
  font-weight: 500;
  letter-spacing: 0.07em;
  color: rgba(232,236,245,0.75);
  transition: color 0.2s;
  text-transform: uppercase;
}
.nav-links a:hover { color: #ffffff; }

.nav-right {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: rgba(232,236,245,0.55);
}

/* HERO */
.hero {
  position: relative;
  z-index: 10;
  flex: 1;
  display: flex;
  align-items: center;
  padding: 0 56px;
  gap: 0;
  opacity: 0;
  animation: reveal 1s ease 0.15s forwards;
}

/* Left: headline takes ~60% */
.hero-left {
  flex: 0 0 62%;
}

h1 {
  font-size: clamp(52px, 5.8vw, 86px);
  font-weight: 300;
  line-height: 1.06;
  letter-spacing: -0.03em;
  color: #ffffff;
}
h1 .line2 {
  font-weight: 600;
  display: block;
}

/* Right: sub + CTA ~38% */
.hero-right {
  flex: 0 0 38%;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 28px;
  padding-left: 48px;
  /* Sit slightly above centre */
  margin-top: -40px;
}

p.sub {
  font-size: 19px;
  font-weight: 400;
  line-height: 1.65;
  color: rgba(232,236,245,0.75);
}

.cta-row {
  display: flex;
  align-items: center;
  gap: 20px;
}

.cta {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: #E8ECF5;
  color: #05090F;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-weight: 600;
  font-size: 12.5px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 15px 30px;
  border: none;
  border-radius: 3px;
  cursor: pointer;
  text-decoration: none;
  transition: opacity 0.2s, transform 0.15s;
}
.cta:hover { opacity: 0.85; transform: translateY(-1px); }

.coming-tag {
  display: flex;
  align-items: center;
  gap: 8px;
}
.coming-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #5A8FFF;
  box-shadow: 0 0 7px rgba(90,143,255,0.9);
  animation: blink 2.4s ease-in-out infinite;
}
.coming-text {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: rgba(232,236,245,0.45);
}

@keyframes reveal {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes blink {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0.2; }
}

@media (max-width: 820px) {
  nav { padding: 0 28px; }
  .nav-links { display: none; }
  .hero {
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    padding: 0 28px;
    gap: 40px;
  }
  .hero-left { flex: none; }
  .hero-right { flex: none; padding-left: 0; margin-top: 0; max-width: 100%; }
  h1 { font-size: clamp(40px, 10vw, 64px); }
  p.sub { font-size: 16px; }
}
</style>
</head>
<body>

<div class="bg"></div>

<nav>
  <a class="logo" href="#">
    <span class="logo-a">Aegos&nbsp;</span><span class="logo-b">Intel</span>
  </a>
  <ul class="nav-links">
    <li><a href="#">Product</a></li>
    <li><a href="#">Data</a></li>
    <li><a href="#">Pricing</a></li>
    <li><a href="#">Docs</a></li>
  </ul>
  <span class="nav-right">aegosintel.com</span>
</nav>

<main class="hero">
  <div class="hero-left">
    <h1>The Intelligence Layer<span class="line2">For Company Research</span></h1>
  </div>
  <div class="hero-right">
    <p class="sub">Structured company data, deal intelligence, and investor signals. Purpose-built for the professionals who can't afford to be wrong.</p>
    <div class="cta-row">
      <a href="#" class="cta">
        Request Early Access
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
          <path d="M2 6.5h9M8 3l3.5 3.5L8 10" stroke="#05090F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
      <div class="coming-tag">
        <span class="coming-dot"></span>
        <span class="coming-text">Coming Soon</span>
      </div>
    </div>
  </div>
</main>

</body>
</html>
