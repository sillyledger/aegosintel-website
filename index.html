<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aegos Intel — Company Intelligence Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: #F2F0EB;
  color: #111;
  font-family: 'Plus Jakarta Sans', sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* ─── Nav ─── */
nav {
  position: sticky;
  top: 0;
  z-index: 100;
  background: #F2F0EB;
}
.nav-inner {
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 48px;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.logo { display: flex; align-items: baseline; text-decoration: none; }
.logo-a { font-size: 14px; font-weight: 300; color: rgba(17,17,17,0.55); letter-spacing: 0.16em; text-transform: uppercase; }
.logo-b { font-size: 14px; font-weight: 600; color: #111; letter-spacing: 0.16em; text-transform: uppercase; }

/* ─── Hero ─── */
.hero {
  min-height: calc(100vh - 64px);
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding-bottom: 0;
  opacity: 0;
  animation: reveal 0.9s ease 0.1s forwards;
}
.hero-inner {
  max-width: 1100px;
  margin: 0 auto;
  padding: 60px 48px 0;
  width: 100%;
}

.coming-badge {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 40px;
}
.coming-dot { width: 9px; height: 9px; border-radius: 50%; background: #111; animation: blink 2.4s ease-in-out infinite; }
.coming-text {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: #111;
}

.data-bars {
  display: flex;
  align-items: flex-end;
  gap: 5px;
  height: 80px;
  margin-bottom: 32px;
  width: 100%;
}
.bar { flex: 1; border-radius: 2px 2px 0 0; }

h1 {
  font-family: 'Lora', Georgia, serif;
  font-size: clamp(52px, 5.8vw, 82px);
  font-weight: 400;
  line-height: 1.1;
  letter-spacing: -0.02em;
  color: #111;
  margin-bottom: 32px;
}
h1 em { font-style: italic; }

.hero-bottom {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 48px;
  align-items: end;
}
p.sub {
  font-size: 17px;
  font-weight: 400;
  line-height: 1.72;
  color: rgba(17,17,17,0.72);
}
.cta-col {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 14px;
}
.cta {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  background: #111;
  color: #fff;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-weight: 600;
  font-size: 12px;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  padding: 13px 24px;
  border: none;
  border-radius: 999px;
  cursor: pointer;
  text-decoration: none;
  transition: background 0.2s, transform 0.15s;
}
.cta:hover { background: #333; transform: translateY(-1px); }

/* ─── Animations ─── */
@keyframes reveal { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
@keyframes blink  { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }

/* ─── Mobile ─── */
@media (max-width: 780px) {
  .nav-inner, .hero-inner { padding-left: 24px; padding-right: 24px; }
  h1 { font-size: clamp(34px, 7vw, 52px); }
  .hero-bottom { grid-template-columns: 1fr; gap: 24px; }
}
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a class="logo" href="#"><span class="logo-a">Aegos&nbsp;</span><span class="logo-b">Intel</span></a>
  </div>

  <!-- ─── Hero ─── -->

        <div class="bar" style="height:84%;background:#1d4ed8"></div>
        <div class="bar" style="height:76%;background:#3b82f6"></div>
        <div class="bar" style="height:86%;background:#3b82f6"></div>
        <div class="bar" style="height:72%;background:#6366f1"></div>
        <div class="bar" style="height:62%;background:#6366f1"></div>
        <div class="bar" style="height:76%;background:#6366f1"></div>

        <div class="bar" style="height:73%;background:#4B5563"></div>
        <div class="bar" style="height:59%;background:#6B7280"></div>
        <div class="bar" style="height:49%;background:#6B7280"></div>
        <div class="bar" style="height:64%;background:#9CA3AF"></div>
        <div class="bar" style="height:43%;background:#9CA3AF"></div>
        <div class="bar" style="height:36%;background:#D1D5DB"></div>

        <div class="bar" style="height:31%;background:#E5E7EB"></div>

      <h1>The intelligence layer<br>for <em>company research.</em></h1>

      <div class="hero-bottom">
        <p class="sub">Structured company data, deal intelligence, and investor signals. Purpose-built for the professionals who can't afford to be wrong.</p>
        <div class="cta-col">
          <a href="mailto:pieter@ryokagroup.com?subject=Aegos%20Intel%20Early%20Access" class="cta">
            Request Early Access
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
              <path d="M2 6.5h9M8 3l3.5 3.5L8 10" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </a>
        </div>
      </div>

    </div>
  </div>
</main>

</body>
</html>
