<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aegos Intel — Company Intelligence Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  overflow: hidden;
  background: #F2F0EB;
  color: #111;
  font-family: 'Plus Jakarta Sans', sans-serif;
}

body {
  display: flex;
  flex-direction: column;
  height: 100vh;
}

nav { flex-shrink: 0; }

.nav-inner {
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 48px;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo { display: flex; align-items: baseline; text-decoration: none; }
.logo-a { font-size: 14px; font-weight: 300; color: rgba(17,17,17,0.55); letter-spacing: 0.16em; text-transform: uppercase; }
.logo-b { font-size: 14px; font-weight: 600; color: #111; letter-spacing: 0.16em; text-transform: uppercase; }

.nav-links { display: flex; align-items: center; gap: 32px; list-style: none; }
.nav-links a { text-decoration: none; font-size: 12px; font-weight: 500; letter-spacing: 0.08em; color: rgba(17,17,17,0.45); transition: color 0.2s; text-transform: uppercase; }
.nav-links a:hover { color: #111; }

.nav-right { font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(17,17,17,0.3); }

.hero {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  opacity: 0;
  animation: reveal 0.9s ease 0.1s forwards;
}

.hero-inner {
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 48px;
  width: 100%;
}

.data-bars {
  display: flex;
  align-items: flex-end;
  gap: 5px;
  height: 80px;
  margin-bottom: 36px;
  width: 100%;
}
.bar { flex: 1; border-radius: 2px 2px 0 0; }

h1 {
  font-family: 'Lora', Georgia, serif;
  /* Sized so "The intelligence layer" and "for company research." each fill ~half the container width */
  font-size: clamp(52px, 5.8vw, 82px);
  font-weight: 400;
  line-height: 1.1;
  letter-spacing: -0.02em;
  color: #111;
  margin-bottom: 36px;
}
h1 em { font-style: italic; }

.hero-bottom {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 48px;
  align-items: end;
}

p.sub {
  font-size: 17px;
  font-weight: 400;
  line-height: 1.72;
  color: rgba(17,17,17,0.72);
}

.cta-col {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 14px;
}

.cta {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  background: #111;
  color: #fff;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-weight: 600;
  font-size: 12px;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  padding: 13px 24px;
  border: none;
  border-radius: 999px;
  cursor: pointer;
  text-decoration: none;
  transition: background 0.2s, transform 0.15s;
}
.cta:hover { background: #333; transform: translateY(-1px); }

.coming-tag { display: flex; align-items: center; gap: 7px; }
.coming-dot { width: 5px; height: 5px; border-radius: 50%; background: #999; animation: blink 2.4s ease-in-out infinite; }
.coming-text { font-size: 11px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(17,17,17,0.38); }

@keyframes reveal { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }

@media (max-width: 780px) {
  .nav-links { display: none; }
  .nav-inner, .hero-inner { padding: 0 24px; }
  h1 { font-size: clamp(34px, 7vw, 52px); }
  .hero-bottom { grid-template-columns: 1fr; gap: 24px; }
}
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a class="logo" href="#"><span class="logo-a">Aegos&nbsp;</span><span class="logo-b">Intel</span></a>
    <ul class="nav-links">
      <li><a href="#">Product</a></li>
      <li><a href="#">Data</a></li>
      <li><a href="#">Pricing</a></li>
      <li><a href="#">Docs</a></li>
    </ul>
    <span class="nav-right">aegosintel.com</span>
  </div>
</nav>

<main class="hero">
  <div class="hero-inner">

    <div class="data-bars" aria-hidden="true">
      <div class="bar" style="height:48%;background:#111"></div>
      <div class="bar" style="height:64%;background:#111"></div>
      <div class="bar" style="height:54%;background:#111"></div>
      <div class="bar" style="height:80%;background:#111"></div>
      <div class="bar" style="height:70%;background:#111"></div>
      <div class="bar" style="height:90%;background:#1d4ed8"></div>
      <div class="bar" style="height:98%;background:#1d4ed8"></div>
      <div class="bar" style="height:100%;background:#1d4ed8"></div>
      <div class="bar" style="height:92%;background:#1d4ed8"></div>
      <div class="bar" style="height:84%;background:#1d4ed8"></div>
      <div class="bar" style="height:76%;background:#3b82f6"></div>
      <div class="bar" style="height:86%;background:#3b82f6"></div>
      <div class="bar" style="height:72%;background:#6366f1"></div>
      <div class="bar" style="height:62%;background:#6366f1"></div>
      <div class="bar" style="height:76%;background:#6366f1"></div>
      <div class="bar" style="height:66%;background:#4B5563"></div>
      <div class="bar" style="height:56%;background:#4B5563"></div>
      <div class="bar" style="height:73%;background:#4B5563"></div>
      <div class="bar" style="height:59%;background:#6B7280"></div>
      <div class="bar" style="height:49%;background:#6B7280"></div>
      <div class="bar" style="height:64%;background:#9CA3AF"></div>
      <div class="bar" style="height:43%;background:#9CA3AF"></div>
      <div class="bar" style="height:36%;background:#D1D5DB"></div>
      <div class="bar" style="height:50%;background:#D1D5DB"></div>
      <div class="bar" style="height:31%;background:#E5E7EB"></div>
      <div class="bar" style="height:23%;background:#E5E7EB"></div>
      <div class="bar" style="height:16%;background:#F3F4F6"></div>
      <div class="bar" style="height:10%;background:#F3F4F6"></div>
    </div>

    <h1>The intelligence layer<br>for <em>company research.</em></h1>

    <div class="hero-bottom">
      <p class="sub">Structured company data, deal intelligence, and investor signals. Purpose-built for the professionals who can't afford to be wrong.</p>
      <div class="cta-col">
        <a href="#" class="cta">
          Request Early Access
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
            <path d="M2 6.5h9M8 3l3.5 3.5L8 10" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
        <div class="coming-tag">
          <span class="coming-dot"></span>
          <span class="coming-text">Coming Soon</span>
        </div>
      </div>
    </div>

  </div>
</main>

</body>
</html>
